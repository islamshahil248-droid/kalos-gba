name: Build GBA

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4

      - name: Compile game
        run: |
          /opt/devkitpro/devkitARM/bin/arm-none-eabi-gcc \
            -mthumb -mthumb-interwork \
            -specs=gba.specs -O2 main.c -o game.elf

          /opt/devkitpro/devkitARM/bin/arm-none-eabi-objcopy \
            -O binary game.elf game.gba

          gbafix game.gba || true

      - uses: actions/upload-artifact@v4
        with:
          name: game
          path: game.gba
